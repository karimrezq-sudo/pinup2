  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px" role="img" aria-label="Answer scores so far: ${vals.join(", ")}">
    <line x1="8" x2="${w - 8}" y1="${y(70)}" y2="${y(70)}" stroke="var(--line)" stroke-dasharray="4 4"/>
    <polyline points="${pts}" fill="none" stroke="#8f7cff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${vals.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="${i === vals.length - 1 ? 5 : 3}" fill="${i === vals.length - 1 ? "#ff9f7a" : "#8f7cff"}"/>`).join("")}

}

function moveViewer(d) {
  if (!viewer) return;
  const n = filesFor(viewer.set).length, j = viewer.i + d;
  if (j < 0 || j >= n) return;
  viewer.i = j; viewer.zoom = false; drawViewer();
  $("viewer").querySelector(d > 0 ? "[data-act=v-next]" : "[data-act=v-prev]")?.focus({ preventScroll: true });
}
$("overlay-host").addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === "ov-close") { viewer = null; closeOverlay(); }
  else if (a === "v-prev") moveViewer(-1);
  else if (a === "v-next") moveViewer(1);
  else if (a === "v-zoom") { viewer.zoom = !viewer.zoom; drawViewer(); }
});
document.addEventListener("keydown", (ev) => {
  if (!ov) return;
  if (ev.key === "Escape") { ev.preventDefault(); viewer = null; closeOverlay(); }
  else if (viewer && ev.key === "ArrowRight") moveViewer(1);
  else if (viewer && ev.key === "ArrowLeft") moveViewer(-1);
  else if (ev.key === "Tab") {
    const f = [...ov.el.querySelectorAll("button:not([disabled]), a[href]")];
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  }
});

/* ---------- answer timer ---------- */
const TM = { key: "", end: 0, total: 0, warned: false };
function timerHTML(r) {
  const key = r.id + ":" + r.messages.length;
  if (TM.key !== key) { TM.key = key; TM.total = r.timer; TM.end = Date.now() + r.timer * 1000; TM.warned = false; }
  return `<span class="timer" id="timer" role="timer" aria-live="off"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--line)" stroke-width="4"/><circle class="t-arc" cx="18" cy="18" r="15" fill="none" stroke="#8f7cff" stroke-width="4" stroke-linecap="round" stroke-dasharray="94.25" stroke-dashoffset="0"/></svg><span id="timer-txt"></span><button type="button" class="add" data-act="timer-add" aria-label="Add 30 seconds">+30s</button></span>`;
}
function tickTimer() {
  const el = $("timer"); if (!el) return;
  const left = Math.max(0, TM.end - Date.now()), s = Math.ceil(left / 1000);
  const frac = TM.total ? left / (TM.total * 1000) : 0;
  el.querySelector(".t-arc").style.strokeDashoffset = String(94.25 * (1 - Math.min(1, frac)));
  el.querySelector(".t-arc").style.stroke = s <= 15 ? (s === 0 ? "var(--flag)" : "var(--warn)") : "#8f7cff";
  el.classList.toggle("low", s > 0 && s <= 15); el.classList.toggle("out", s === 0);
  $("timer-txt").textContent = s === 0 ? "Time" : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  if (s > 0 && s <= 5 && TM.lastTick !== s) { TM.lastTick = s; SFX.tick(); }
  if (s === 0 && !TM.warned) { TM.warned = true; toast("Time! Send what you have. Short and clear wins."); }
}
setInterval(tickTimer, 250);

/* ---------- events ---------- */
const $screen = $("screen");
$screen.addEventListener("click", async (ev) => {

  switch (act) {
    case "home": S.screen = "home"; S.pid = null; S.ui = {}; S.err = {}; S.stickBottom = false; render(); break;

    case "wiz-back": captureWiz(); S.ui.wizStep = Math.max(0, (S.ui.wizStep || 0) - 1); render(); break;

      captureWiz();
      const w = S.ui.wiz;

      np.concept = w.idea.trim();
      await saveProject(np); S.pid = np.id; S.screen = "project"; S.tab = "boards"; S.ui = {}; render(); toast("Project created. Now pin up your boards."); break;
    }
    case "example": { const ex = exampleProject(); await saveProject(ex); S.pid = ex.id; S.screen = "project"; S.tab = "overview"; S.ui = {}; render(); break; }
    case "open": S.pid = b.dataset.id; S.screen = "project"; S.tab = "overview"; S.ui = {}; S.err = {}; render(); break;
    case "tab": go(b.dataset.tab); break;
    case "del": {
      const key = b.dataset.key;
      if (S.confirm !== key) { S.confirm = key; render(); setTimeout(() => { if (S.confirm === key) { S.confirm = null; render(); } }, 4000); return; }
      S.confirm = null;
      const kind = key.slice(0, key.indexOf(":")), id = key.slice(key.indexOf(":") + 1);
      if (kind === "project") { await store.del(id); S.projects = S.projects.filter((x) => x.id !== id); S.pid = null; S.screen = "home"; S.ui = {}; }
      else if (p && kind === "it") { p.iterations = p.iterations.filter((x) => x.id !== id); await saveProject(p); }
      else if (p && kind === "r") { p.rehearsals = p.rehearsals.filter((x) => x.id !== id); await saveProject(p); }
      else if (p && kind === "crit") { p.crits = p.crits.filter((x) => x.id !== id); p.feedback = p.feedback.filter((f) => f.critId !== id); S.ui.critView = null; await saveProject(p); }
      render(); break;
    }
    case "rm-pending": S.ui.itLabel = $("it-label")?.value || S.ui.itLabel; S.ui.pending.splice(Number(b.dataset.i), 1); render(); break;
    case "it-name": { const el = $("it-label"); if (el) { el.value = b.dataset.v; S.ui.itLabel = b.dataset.v; } break; }
    case "save-it": {
      const files = S.ui.pending || []; if (!files.length) return;
      p.iterations.push({ id: uid(), label: ($("it-label")?.value || "").trim() || `Iteration ${p.iterations.length + 1}`, note: "", createdAt: Date.now(), files });
      S.ui.pending = []; S.ui.itLabel = ""; S.err.files = null; await saveProject(p); render(); toast("Pinned up ✓"); break;
    }
    case "persona": { const sel = new Set(S.ui.personas || ["tutor", "context", "external"]); sel.has(b.dataset.id) ? sel.delete(b.dataset.id) : sel.add(b.dataset.id); S.ui.personas = [...sel]; S.ui.juryIt = $("jury-it")?.value || S.ui.juryIt; render(); break; }
    case "diff": S.ui.diff = b.dataset.id; S.ui.juryIt = $("jury-it")?.value || S.ui.juryIt; render(); break;
    case "start-jury": {
      const itId = $("jury-it")?.value || S.ui.juryIt || p.iterations[p.iterations.length - 1].id;
      const r = { id: uid(), date: Date.now(), iterationId: itId, personas: S.ui.personas || ["tutor", "context", "external"], difficulty: S.ui.diff || SET.mood, timer: S.ui.timer ?? SET.timer, messages: [], report: null };
      p.rehearsals.push(r); await saveProject(p); S.ui.rid = r.id; S.ui.draft = ""; S.ui.help = null; S.ui.pick = {}; S.ui.breathed = false;
      SFX.unlock(); if (ttsOK() && SET.voice) { try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch {} }
      render(); break;
    }
    case "breathed": S.ui.breathed = true; render(); break;
    case "mic": if (MIC.on) micStop(); else micStart(); break;
    case "voice-toggle": SET.voice = !SET.voice; saveSettings(); if (!SET.voice) stopSpeaking(); SFX.toggle(SET.voice); render(); break;
    case "transcript": { const r = p.rehearsals.find((x) => x.id === S.ui.rid); if (r) openTranscript(r, b); break; }
    case "settings": S.screen = "settings"; S.ui = {}; render(); break;
    case "play-intro": playIntro(true); break;
    case "install": if (installEvt) { installEvt.prompt(); const c = await installEvt.userChoice.catch(() => null); installEvt = null; if (c && c.outcome === "accepted") toast("Installing PinUp…"); render(); } break;
    case "install-hide": try { localStorage.setItem("pinup-install-hide", "1"); } catch {} render(); break;
    case "set-toggle": SET[b.dataset.k] = !SET[b.dataset.k]; saveSettings(); render(); break;
    case "set-timer": SET.timer = Number(b.dataset.v); saveSettings(); render(); break;
    case "set-mood": SET.mood = b.dataset.v; saveSettings(); render(); break;
    case "wipe": {
      if (S.confirm !== "wipe") { S.confirm = "wipe"; render(); setTimeout(() => { if (S.confirm === "wipe") { S.confirm = null; render(); } }, 4000); return; }
      S.confirm = null; for (const x of S.projects) await store.del(x.id); S.projects = []; S.screen = "home"; render(); toast("All projects deleted."); break;
    }
    case "keep-going": { const r = p.rehearsals.find((x) => x.id === S.ui.rid); if (r && !S.busy.jury) { SFX.pick(); r.extra = (r.extra || 0) + 1; startJuryTurn(p, r, "I'd like to keep going, please."); } break; }
    case "practise": {
      const old = p.rehearsals.find((x) => x.id === S.ui.rid); if (!old || !old.report) return;
      const r = { id: uid(), date: Date.now(), iterationId: old.iterationId, personas: old.personas, difficulty: old.difficulty, timer: old.timer, focus: old.report.practise, messages: [], report: null };
      p.rehearsals.push(r); S.ui.rid = r.id; S.ui.breathed = true; S.ui.draft = "";
      await saveProject(p); startJuryTurn(p, r, "I'm ready to practise the questions I found hard last time.");
      break;
    }
    case "timer-pick": S.ui.timer = Number(b.dataset.v); S.ui.juryIt = $("jury-it")?.value || S.ui.juryIt; render(); break;
    case "timer-add": TM.end = Math.max(TM.end, Date.now()) + 30000; TM.total = Math.max(TM.total, Math.ceil((TM.end - Date.now()) / 1000)); TM.warned = false; tickTimer(); break;
    case "view": captureCritDraft(); openViewer(b.dataset.set, Number(b.dataset.i), b); break;
    case "checkup": { const r = p.rehearsals.find((x) => x.id === (b.dataset.rid || S.ui.rid)); if (r) openCheckup(r, b); break; }
    case "help-say": { const r = p.rehearsals.find((x) => x.id === S.ui.rid); if (r) { S.ui.breathed = true; helpSay(p, r); } break; }
    case "help-pick": {
      const k = b.dataset.k, i = Number(b.dataset.i);
      S.ui.pick = S.ui.pick || {};
      S.ui.pick[k] = S.ui.pick[k] === i ? null : i;
      S.ui.draft = composeFromPicks(p); render();
      break;
    }
    case "use-opt": {
      const r = p.rehearsals.find((x) => x.id === S.ui.rid);
      const last = r && [...r.messages].reverse().find((m) => m.role === "assistant");
      const o = last && arr(last.options)[Number(b.dataset.i)];
      if (!o) return;
      S.ui.draft = o.replace(/…$/, "").trimEnd() + (o.endsWith("…") ? " " : "");
      render();
      const t = $("answer"); if (t) { t.rows = 3; t.focus(); t.setSelectionRange(t.value.length, t.value.length); }
      break;
    }
    case "quick": { const r = p.rehearsals.find((x) => x.id === S.ui.rid); if (r && !S.busy.jury) startJuryTurn(p, r, b.dataset.v); break; }
    case "open-r": S.ui.rid = b.dataset.id; S.ui.breathed = true; S.err.jury = null; S.stickBottom = true; render(); S.stickBottom = false; break;
    case "close-r": S.ui.rid = null; S.err.jury = null; render(); break;
    case "stop": juryCtl?.abort(); break;
    case "debrief": {
      const r = p.rehearsals.find((x) => x.id === S.ui.rid);
      if (r && !S.busy.jury) { await debrief(p, r); if (r.report) { confetti(); toast(CHEERS[(Math.random() * CHEERS.length) | 0]); } }
      break;
    }
    case "new-crit": S.ui.critView = "new"; render(); break;
    case "close-crit": captureCritDraft(); S.ui.critView = null; S.err.crit = null; render(); break;
    case "open-crit": S.ui.critView = b.dataset.id; render(); break;
    case "crit-title": captureCritDraft(); S.ui.critDraft = { ...(S.ui.critDraft || { jurors: "", text: "" }), title: b.dataset.v }; render(); break;
    case "speaker": {
      const ta = $("cr-text"); const v = ta.value.replace(/\s*$/, "");
      ta.value = (v ? v + "\n\n" : "") + `[${b.dataset.name}]: `;
      ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); ta.scrollTop = ta.scrollHeight; captureCritDraft(); break;
    }
    case "digest": {
      captureCritDraft();
      const d = S.ui.critDraft;
      if (!d || d.text.trim().length < 30) { S.err.crit = "Add a little more of what they said first."; render(); return; }
      if (aiStatus !== "ready") { S.err.crit = "The jury can't be reached right now. Reload and try again."; render(); return; }
      await digestCrit(p, d);
      if (!S.err.crit) toast("Sorted. Here's your to-do list.");
      break;
    }
    case "filter": S.ui.filter = b.dataset.id; S.ui.copyText = null; render(); break;
    case "status": {
      const f = p.feedback.find((x) => x.id === b.dataset.id);
      if (f) { const was = f.status; f.status = b.dataset.v; await saveProject(p); render(); if (b.dataset.v === "addressed" && was !== "addressed") { confetti(); toast("One more done ✓"); } }
      break;
    }
    case "check": {
      const before = p.feedback.filter((f) => f.status === "addressed").length;
      await checkIteration(p, $("check-it")?.value || S.ui.checkIt || p.iterations[p.iterations.length - 1].id);
      const gained = p.feedback.filter((f) => f.status === "addressed").length - before;
      if (gained > 0) { confetti(); toast(`${plural(gained, "point")} addressed. Great work!`); }
      else if (!S.err.check) toast("Checked. Here's where each point stands.");
      break;
    }
    case "copy": {
      const filter = S.ui.filter || "active";
      const list = p.feedback.filter((f) => filter === "all" || (filter === "done" ? f.status === "addressed" : f.status === "open" || f.status === "partial")).sort((a, c) => PRI[a.priority] - PRI[c.priority]);
      const text = list.map((f) => `[${f.priority.toUpperCase()}] ${f.action}\n   ${f.juror}: "${f.said}" (${STATUS[f.status]})`).join("\n\n");
      try { await navigator.clipboard.writeText(text); S.ui.copied = true; S.ui.copyText = null; render(); setTimeout(() => { S.ui.copied = false; render(); }, 1500); }
      catch { S.ui.copyText = text; render(); const box = $("copy-box"); box?.focus(); box?.select(); }
      break;
    }
  }
});

function captureCritDraft() {
  const j = $("cr-jurors"), x = $("cr-text");
  if (j && x) S.ui.critDraft = { title: (S.ui.critDraft && S.ui.critDraft.title) || "", jurors: j.value, text: x.value };
}

$screen.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const f = ev.target.dataset.form, p = curProject();
  if (f === "details") {
    p.title = $("pd-title").value.trim() || p.title; p.studio = $("pd-studio").value.trim();
    p.brief = $("pd-brief").value.trim(); p.concept = $("pd-concept").value.trim();
    await saveProject(p); S.ui.saved = true; render(); setTimeout(() => { S.ui.saved = false; render(); }, 1500);
  } else if (f === "answer") {
    const r = p.rehearsals.find((x) => x.id === S.ui.rid);
    const text = $("answer").value.trim();
    if (!r || !text || S.busy.jury) return;
    if (aiStatus !== "ready") { S.err.jury = "The jury can't be reached right now. Reload and try again."; render(); return; }
    S.ui.breathed = true; S.ui.help = null;
    startJuryTurn(p, r, text);
  }
});

$screen.addEventListener("change", async (ev) => {
  const t = ev.target;
  if (t.id === "it-files") {
    const picked = [...t.files]; t.value = "";
    S.ui.itLabel = $("it-label")?.value || S.ui.itLabel;
    S.busy.files = true; S.err.files = null; render();
    const out = S.ui.pending || [];
    for (const file of picked) {
      if (out.length >= 8) { S.err.files = "Up to 8 boards per iteration. The rest were skipped."; break; }
      try { out.push(await toBoard(file)); } catch (e) { S.err.files = e.message; }
    }
    S.ui.pending = out; S.busy.files = false; render();
  } else if (t.id === "jury-it") S.ui.juryIt = t.value;
  else if (t.id === "check-it") S.ui.checkIt = t.value;
  else if (t.id === "set-lang") { SET.lang = t.value; saveSettings(); toast(`Language set to ${t.value}`); }
  else if (t.id === "cr-jurors") { captureCritDraft(); render(); }
});

$screen.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.id === "answer") { S.ui.draft = t.value; t.style.height = "auto"; t.style.height = Math.min(150, t.scrollHeight) + "px"; }
  else if (t.id === "cr-text") captureCritDraft();
  else if (t.id === "it-label") S.ui.itLabel = t.value;
});
$screen.addEventListener("keydown", (ev) => {
  if (ev.target.id === "answer" && ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); ev.target.form.requestSubmit(); }
});

  const el = document.createElement("div");

  $("screen").appendChild(el);
  const q = (sel) => el.querySelector(sel), qa = (sel) => [...el.querySelectorAll(sel)];
  const OUT = "cubic-bezier(.16,1,.3,1)", INOUT = "cubic-bezier(.65,0,.35,1)", SPRING = "cubic-bezier(.34,1.56,.64,1)";
  const anims = [];
  const A = (node, frames, o) => { if (!node) return; const a = node.animate(frames, Object.assign({ fill: "both" }, o)); anims.push(a); return a; };
  const wordsIn = (line, start, step = 110) => qa(`#${line} .iw`).forEach((w, i) => A(w, [{ opacity: 0, filter: "blur(14px)", transform: "translateY(18px)" }, { opacity: 1, filter: "blur(0)", transform: "none" }], { duration: 760, delay: start + i * step, easing: OUT }));
  const lineOut = (line, at) => A(q("#" + line), [{ opacity: 1, filter: "blur(0)", transform: "none" }, { opacity: 0, filter: "blur(10px)", transform: "translateY(-14px)" }], { duration: 480, delay: at, easing: "cubic-bezier(.4,0,1,1)" });

    const fly = still ? 1 : 900;
    if (!still) {
      q(".intro-archwrap").animate([{ transform: "scale(1)", opacity: 1 }, { transform: "scale(9)", opacity: 0 }], { duration: fly, easing: "cubic-bezier(.7,0,.2,1)", fill: "forwards" });
      ["#il3", ".intro-brand", ".intro-sub", ".intro-enter", ".intro-bench", ".intro-skip"].forEach((sel) => q(sel)?.animate([{ opacity: 1 }, { opacity: 0, transform: "translateY(10px)" }], { duration: 300, fill: "forwards", easing: "ease-in" }));
    }
    el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: still ? 300 : 520, delay: still ? 0 : fly - 420, easing: "ease-out", fill: "forwards" }).onfinish = () => el.remove();
    ["appbar", "scroll", "bottom"].forEach((id, i) => $(id).animate([{ opacity: 0, transform: "scale(.965)", filter: "blur(6px)" }, { opacity: 1, transform: "none", filter: "blur(0)" }], { duration: still ? 300 : 820, delay: still ? 0 : fly - 380 + i * 60, easing: OUT, fill: "backwards" }));
  }
  el.addEventListener("click", enter);
  el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " " || e.key === "Escape") { e.preventDefault(); enter(); } });
  if (still) {
    A(q(".intro-stage"), [{ opacity: 0 }, { opacity: 1 }], { duration: 500 });
    qa(".iw").forEach((w) => (w.style.opacity = 1)); q("#il1").style.display = q("#il2").style.display = "none";
    q(".i-line").setAttribute("stroke-dashoffset", "0");
    auto = setTimeout(enter, 1800);
  } else {
    A(q(".intro-glow"), [{ opacity: 0 }, { opacity: 1 }], { duration: 1600, easing: "ease-out" });
    A(q(".i-line"), [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: 1200, delay: 200, easing: INOUT });
    A(q(".i-fill"), [{ opacity: 0 }, { opacity: 1 }], { duration: 1000, delay: 1000, easing: "ease-out" });
    A(q(".i-grid"), [{ opacity: 0 }, { opacity: 1 }], { duration: 900, delay: 1300, easing: "ease-out" });
    A(q(".i-sun"), [{ transform: "translateY(80px)", opacity: 0 }, { transform: "translateY(0)", opacity: 1 }], { duration: 1800, delay: 1100, easing: OUT });
    A(q(".intro-archwrap"), [{ transform: "scale(.94)" }, { transform: "scale(1)" }], { duration: 2600, delay: 0, easing: OUT });
    wordsIn("il1", 1450); lineOut("il1", 2750);
    wordsIn("il2", 3050, 95);
    qa(".iav").forEach((a, i) => A(a, [{ opacity: 0, transform: "translateY(26px) scale(.6)" }, { opacity: 1, transform: "none" }], { duration: 760, delay: 3250 + i * 90, easing: SPRING }));
    lineOut("il2", 4500);
    wordsIn("il3", 4800, 120);
    A(q(".iw.ready"), [{ backgroundPosition: "100% 50%" }, { backgroundPosition: "0% 50%" }], { duration: 1600, delay: 5000, easing: "ease-out" });
    A(q(".intro-brand"), [{ opacity: 0, transform: "translateY(10px)", filter: "blur(8px)" }, { opacity: 1, transform: "none", filter: "blur(0)" }], { duration: 800, delay: 5500, easing: OUT });
    A(q(".intro-sub"), [{ opacity: 0 }, { opacity: 1 }], { duration: 700, delay: 5750, easing: "ease-out" });
    A(q(".intro-enter"), [{ opacity: 0, transform: "translateY(12px) scale(.96)" }, { opacity: 1, transform: "none" }], { duration: 700, delay: 6000, easing: SPRING });
    A(q(".intro-skip"), [{ opacity: 0 }, { opacity: 1 }], { duration: 600, delay: 600 });
    auto = setTimeout(enter, 9500);
  }
  setTimeout(() => q(".intro-enter")?.focus({ preventScroll: true }), still ? 300 : 6050);
}

if (isStandalone()) { $("desk").classList.add("full"); const db = document.querySelector(".desk-bar"); if (db) db.style.display = "none"; }
if ("serviceWorker" in navigator && location.protocol === "https:") window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
(async () => { applySettings(); render(); playIntro(false); await store.open(); S.projects = await store.all(); render(); })();

  try { sample = window.claude && window.claude.use ? await window.claude.use("sample") : null; } catch { sample = null; }
  if (sample) { try { limits = await sample.limits(); } catch { limits = null; } aiStatus = "ready"; } else aiStatus = "none";
